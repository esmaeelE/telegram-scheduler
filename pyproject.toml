[project]
name = "telegram-scheduler"
version = "0.2.0"
description = "Schedule or send Telegram messages to multiple contacts with Telethon."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.34,<2",
]

[project.scripts]
telegram-scheduler = "telegram_scheduler.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_scheduler"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
